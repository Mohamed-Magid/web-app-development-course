<!DOCTYPE html>
<html>
<head>
    <title>05 - HTML Tables</title>
</head>
<body>
    <!-- Tables are used to display data in rows and columns.
         Main table elements:
           <table> - table container
           <tr>    - table row
           <th>    - table header (bold by default)
           <td>    - table data -->

    <h1>HTML Tables</h1>

    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Ali</td>
            <td>21</td>
        </tr>
    </table>

    <p><small>&lt;th&gt; creates bold headers, &lt;td&gt; contains table data.</small></p>

    <p><a href="index.html">Back to the combined showcase</a></p>
</body>
</html>
