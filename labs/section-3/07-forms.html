<!DOCTYPE html>
<html>
<head>
    <title>07 - HTML Forms</title>
</head>
<body>
    <!-- Forms allow websites to collect information from users.
         Examples: login forms, registration forms, contact forms, search boxes.
         Form elements:
           <input>  - used for different types of user input (self-closing)
           <label>  - describes an input field
           <button> - used to submit the form -->

    <h1>HTML Forms</h1>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name">
        <button>Submit</button>
    </form>

    <hr>

    <!-- ========== <input> vs <label> ==========
         <input>:
           - PURPOSE: accepts user input (text, password, checkbox, radio, etc.)
           - CONTENT: self-closing tag, no inner content
           - INTERACTION: users type/select data directly
           - ATTRIBUTES: type, name, value, placeholder, required, etc.
         <label>:
           - PURPOSE: provides descriptive text for an input field
           - CONTENT: can wrap an input or contain text
           - INTERACTION: clicking the label focuses the associated input
           - ATTRIBUTES: for (links to the input's id) -->
    <h2>&lt;input&gt; vs &lt;label&gt;</h2>
    <p>
        <label for="username">Username:</label>
        <input type="text" id="username">
    </p>
    <p><small>Click the word "Username:" - the label's <b>for</b> attribute matches
       the input's <b>id</b>, so the input gets focused.</small></p>

    <p><a href="index.html">Back to the combined showcase</a></p>
</body>
</html>
