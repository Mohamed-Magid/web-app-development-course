<!DOCTYPE html>
<html>
<head>
    <title>04 - HTML Images</title>
</head>
<body>
    <!-- Images are added using the <img> tag.
         Important: <img> does NOT require a closing tag - it is self-closing. -->

    <h1>HTML Images</h1>

    <!-- ========== src (SOURCE) ==========
         Specifies the image file path or URL where the image is located -->
    <h2>src attribute</h2>
    <img src="profile.jpg" alt="Profile Image">

    <hr>

    <!-- ========== alt (ALTERNATIVE TEXT) ==========
         - Describes the image content
         - Used when the image cannot load
         - Helps accessibility and SEO -->
    <h2>alt attribute</h2>
    <p>This image does not exist, so the alt text is shown instead:</p>
    <img src="missing-image.jpg" alt="Profile Image">

    <p><a href="index.html">Back to the combined showcase</a></p>
</body>
</html>
