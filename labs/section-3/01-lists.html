<!DOCTYPE html>
<html>
<head>
    <title>01 - HTML Lists</title>
</head>
<body>
    <!-- Lists organize information in a structured way for better readability -->

    <h1>HTML Lists</h1>

    <!-- ========== UNORDERED LIST ==========
         <ul> defines the list container, <li> defines each list item.
         The browser displays items with bullet points.
         Common uses: navigation menus, feature lists, item collections. -->
    <h2>Unordered List (bullets)</h2>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <hr>

    <!-- ========== ORDERED LIST ==========
         <ol> creates a numbered list, <li> represents each item.
         The browser automatically numbers the list.
         Common uses: step-by-step guides, instructions, ranked items. -->
    <h2>Ordered List (numbers)</h2>
    <ol>
        <li>Open VS Code</li>
        <li>Create HTML file</li>
        <li>Run the file in browser</li>
    </ol>

    <p><a href="index.html">Back to the combined showcase</a></p>
</body>
</html>
