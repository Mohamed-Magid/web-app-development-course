<!DOCTYPE html>
<html>
<head>
    <title>08 - Input Types</title>
</head>
<body>
    <!-- HTML provides different input types for collecting
         various types of user data -->

    <h1>Input Types in HTML Forms</h1>

    <form>
        <p>
            <label for="txt">Text:</label>
            <input type="text" id="txt">
        </p>
        <p>
            <label for="em">Email:</label>
            <input type="email" id="em">
        </p>
        <p>
            <label for="pw">Password:</label>
            <input type="password" id="pw">
        </p>
        <p>
            <label for="num">Number:</label>
            <input type="number" id="num">
        </p>

        <hr>

        <!-- Radio button: only ONE option can be selected at a time.
             All radios in a group share the same name attribute. -->
        <p><b>Radio Button (one option only):</b></p>
        <input type="radio" id="opt1" name="option">
        <label for="opt1">Option 1</label>
        <input type="radio" id="opt2" name="option">
        <label for="opt2">Option 2</label>

        <hr>

        <!-- Checkbox: MULTIPLE options can be selected -->
        <p><b>Checkbox (multiple options):</b></p>
        <input type="checkbox" id="ch1" name="choice1">
        <label for="ch1">Choice 1</label>
        <input type="checkbox" id="ch2" name="choice2">
        <label for="ch2">Choice 2</label>
    </form>

    <p><a href="index.html">Back to the combined showcase</a></p>
</body>
</html>
