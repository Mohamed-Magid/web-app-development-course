<!DOCTYPE html>
<html>
<head>
    <title>04 - External CSS</title>

    <!-- EXTERNAL CSS - the recommended approach.
         The styles are stored in the separate file style.css
         and linked here with the <link> tag. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>External CSS</h1>
    <p>This page has NO styles inside it. Open <b>style.css</b> -
       all the styling lives there, and this page links to it with:
       <b>&lt;link rel="stylesheet" href="style.css"&gt;</b></p>
    <p>The same style.css file could be linked from many pages,
       so the whole website shares one design.</p>

    <p><a href="index.html">Back to the combined showcase</a></p>
</body>
</html>
