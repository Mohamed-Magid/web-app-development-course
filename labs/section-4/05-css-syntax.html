<!DOCTYPE html>
<html>
<head>
    <title>05 - CSS Syntax</title>

    <!-- CSS SYNTAX - basic structure:

           selector { property: value; }

           - SELECTOR: the element to style       (p)
           - PROPERTY: the style type             (color)
           - VALUE:    the property setting       (blue)

         Example:
           p { color: blue; font-size: 18px; }
         Multiple declarations are separated by semicolons. -->
    <style>
        /* selector = p, properties = color and font-size */
        p {
            color: blue;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h1>CSS Syntax</h1>
    <p><b>selector { property: value; }</b></p>
    <p>This paragraph has blue text and is 18px in size -
       the result of <b>p { color: blue; font-size: 18px; }</b>
       written in the &lt;style&gt; tag of this page.</p>

    <p><a href="index.html">Back to the combined showcase</a></p>
</body>
</html>
