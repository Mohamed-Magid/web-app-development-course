<!DOCTYPE html>
<html>
<head>
    <title>My Personal Webpage</title>

    <!-- Assignment: Personal Webpage (submit both HTML and CSS files)
         Required elements:
         - Element, Class, and ID selectors  (in assignment-style.css)
         - Text colors on headings and paragraphs
         - Background styling
         - External CSS file linked with <link>  (below) -->
    <link rel="stylesheet" href="assignment-style.css">
</head>
<body>
    <!-- ID selector: #page-title (unique main heading) -->
    <h1 id="page-title">Welcome to My Personal Webpage</h1>

    <!-- Element selectors: h1 and p are styled in the CSS file -->
    <h1>About Me</h1>
    <p>My name is Ahmed. I am a third-year student learning web development.</p>

    <h1>My Hobbies</h1>
    <!-- Class selector: .hobby (reused on multiple paragraphs) -->
    <p class="hobby">Reading</p>
    <p class="hobby">Football</p>
    <p class="hobby">Programming</p>

    <p><a href="index.html">Back to the combined showcase</a></p>
</body>
</html>
