<!DOCTYPE html>
<html>
<head>
    <title>06 - HTML Paragraphs</title>
</head>
<body>
    <h1>HTML Paragraphs</h1>

    <!-- The <p> tag defines a paragraph.
         Browsers automatically add spacing before and after paragraphs. -->
    <p>This is a paragraph in HTML.</p>

    <h2>Multiple Paragraphs</h2>
    <p>Welcome to my website.</p>
    <p>This website was created using HTML.</p>

    <p><i>Notice the automatic spacing the browser adds between each paragraph.</i></p>

    <p><a href="index.html">Back to the combined showcase</a></p>
</body>
</html>
